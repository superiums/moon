<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>互补色色卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: pan-y;
    -webkit-user-select: none; user-select: none;
  }

  /* ========== SLIDES CONTAINER ========== */
  .slides {
    width: 100%; height: 100%;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    padding: clamp(10px, 3vw, 40px);
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ========== COVER ========== */
  .cover-title {
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.2;
  }
  .cover-subtitle {
    font-size: clamp(0.9rem, 3vw, 1.4rem);
    color: rgba(255,255,255,0.5);
    margin-top: clamp(10px, 3vh, 24px);
    letter-spacing: 0.3em;
  }

  /* ========== SETTINGS PANEL (on cover) ========== */
  .settings-panel {
    margin-top: clamp(20px, 5vh, 48px);
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 2vw, 20px);
    justify-content: center;
    align-items: center;
  }
  .settings-panel label {
    color: rgba(255,255,255,0.7);
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    margin-right: 6px;
  }
  .shape-btn {
    padding: clamp(6px, 1.5vw, 10px) clamp(12px, 3vw, 20px);
    border: 2px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    border-radius: 8px;
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    cursor: pointer;
    transition: all 0.25s;
  }
  .shape-btn:hover, .shape-btn.active {
    border-color: #FFE600;
    background: rgba(255,230,0,0.15);
    color: #FFE600;
  }

  /* ========== COLOR CARD PAGE ========== */
  .page-title {
    font-size: clamp(1rem, 3.5vw, 1.6rem);
    font-weight: 700;
    color: #fff;
    margin-bottom: clamp(12px, 3vh, 28px);
    letter-spacing: 0.15em;
    text-align: center;
  }

  .card-container {
    position: relative;
    width: clamp(220px, 55vw, 420px);
    height: clamp(220px, 55vw, 420px);
    cursor: pointer;
    transition: transform 0.3s;
  }
  .card-container:active {
    transform: scale(0.97);
  }

  /* SVG fills the card */
  .card-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hex-labels {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(16px, 5vw, 48px);
    margin-top: clamp(12px, 3vh, 28px);
    flex-wrap: wrap;
  }
  .hex-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .hex-swatch {
    width: clamp(36px, 10vw, 56px);
    height: clamp(36px, 10vw, 56px);
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .hex-text {
    font-size: clamp(0.7rem, 2.2vw, 0.95rem);
    color: rgba(255,255,255,0.8);
    font-family: "SF Mono", "Fira Code", monospace;
    font-weight: 600;
  }

  /* ========== COLOR WHEEL PAGE ========== */
  .wheel-svg {
    width: clamp(240px, 60vw, 440px);
    height: clamp(240px, 60vw, 440px);
  }

  /* ========== AFTERIMAGE EXPERIMENT PAGE ========== */
  .exp-title {
    font-size: clamp(0.9rem, 3vw, 1.3rem);
    color: rgba(255,255,255,0.7);
    margin-bottom: clamp(16px, 4vh, 32px);
    text-align: center;
  }
  .exp-pairs {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 3vh, 24px);
    width: 100%;
    max-width: 500px;
    align-items: center;
  }
  .exp-pair {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .exp-pair:active { transform: scale(0.96); }
  .exp-shape-row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 4vw, 28px);
  }
  .exp-label {
    font-size: clamp(0.65rem, 2vw, 0.85rem);
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .exp-arrow {
    color: rgba(255,255,255,0.4);
    font-size: clamp(0.8rem, 2.5vw, 1rem);
  }

  /* The fullscreen white overlay for afterimage */
  .afterimage-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
  }
  .afterimage-overlay.active { display: flex; }
  .afterimage-overlay .hint {
    position: absolute;
    bottom: clamp(20px, 5vh, 40px);
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    color: #999;
  }

  /* ========== NAVIGATION ========== */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(36px, 8vw, 52px);
    height: clamp(36px, 8vw, 52px);
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.4);
    color: #fff;
    border-radius: 50%;
    font-size: clamp(1rem, 3vw, 1.4rem);
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    backdrop-filter: blur(6px);
  }
  .nav-btn:hover { border-color: #fff; background: rgba(255,255,255,0.15); }
  .nav-prev { left: clamp(8px, 2vw, 20px); }
  .nav-next { right: clamp(8px, 2vw, 20px); }

  .fullscreen-btn {
    position: fixed;
    top: clamp(10px, 2vh, 18px);
    right: clamp(10px, 3vw, 20px);
    width: clamp(36px, 8vw, 44px);
    height: clamp(36px, 8vw, 44px);
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.4);
    color: #fff;
    border-radius: 50%;
    font-size: clamp(0.9rem, 2.8vw, 1.1rem);
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    transition: all 0.25s;
  }
  .fullscreen-btn:hover { border-color: #fff; background: rgba(255,255,255,0.15); }

  /* ========== DOTS ========== */
  .dots {
    position: fixed;
    bottom: clamp(10px, 2.5vh, 20px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: clamp(5px, 1.5vw, 9px);
    z-index: 100;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90vw;
  }
  .dot {
    width: clamp(7px, 2vw, 10px);
    height: clamp(7px, 2vw, 10px);
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.25s;
    border: none;
    padding: 0;
  }
  .dot.active { background: #FFE600; transform: scale(1.3); }

  /* ========== PAGE NUMBER ========== */
  .page-num {
    position: fixed;
    top: clamp(10px, 2vh, 18px);
    left: clamp(10px, 3vw, 20px);
    font-size: clamp(0.75rem, 2.2vw, 0.95rem);
    color: rgba(255,255,255,0.4);
    z-index: 100;
    font-family: "SF Mono", monospace;
  }

  /* ========== SWAP HINT ========== */
  .swap-hint {
    font-size: clamp(0.65rem, 2vw, 0.8rem);
    color: rgba(255,255,255,0.25);
    margin-top: clamp(8px, 2vh, 14px);
    letter-spacing: 0.1em;
  }

  /* ========== RESPONSIVE TWEAKS ========== */
  @media (max-width: 480px) {
    .settings-panel { flex-direction: column; }
    .exp-pairs { gap: 14px; }
  }
</style>
</head>
<body>

<div class="page-num" id="pageNum">1 / 12</div>
<button class="fullscreen-btn" id="fsBtn" title="全屏 (F)">⛶</button>
<button class="nav-btn nav-prev" id="prevBtn">◀</button>
<button class="nav-btn nav-next" id="nextBtn">▶</button>

<div class="slides" id="slides"></div>

<div class="dots" id="dots"></div>

<!-- Afterimage white overlay -->
<div class="afterimage-overlay" id="aiOverlay">
  <span class="hint">点击任意处返回</span>
</div>

<script>
// ============================================================
// 互补色数据数组
// ============================================================
const COLOR_PAIRS = [
  // { bg: 背景色, fg: 前景色, bgName, fgName, hex codes }
  { bg:"#FF3B30", fg:"#00C7BE", bgName:"RED",       fgName:"CYAN",        bgHex:"#FF3B30", fgHex:"#00C7BE" },
  { bg:"#34C759", fg:"#FF2D92", bgName:"GREEN",     fgName:"MAGENTA",    bgHex:"#34C759", fgHex:"#FF2D92" },
  { bg:"#007AFF", fg:"#FFE600", bgName:"BLUE",      fgName:"YELLOW",     bgHex:"#007AFF", fgHex:"#FFE600" },
  { bg:"#FF9F0A", fg:"#5856D6", bgName:"ORANGE",    fgName:"BLUE-PURPLE",bgHex:"#FF9F0A", fgHex:"#5856D6" },
  { bg:"#B6E800", fg:"#AF52DE", bgName:"YELLOW-GREEN", fgName:"PURPLE",   bgHex:"#B6E800", fgHex:"#AF52DE" },
  { bg:"#FF6B1A", fg:"#00C7BE", bgName:"RED-ORANGE",fgName:"CYAN-GREEN", bgHex:"#FF6B1A", fgHex:"#00C7BE" },
  { bg:"#FFCC00", fg:"#007AFF", bgName:"YELLOW-ORANGE", fgName:"BLUE",   bgHex:"#FFCC00", fgHex:"#007AFF" },
  { bg:"#000000", fg:"#FFFFFF", bgName:"BLACK",     fgName:"WHITE",      bgHex:"#000000", fgHex:"#FFFFFF" },
];

// ============================================================
// 形状类型
// ============================================================
const SHAPES = {
  circle: "circle",
  triangle: "triangle",
  star: "star",
  square: "square",
  diamond: "diamond",
  hexagon: "hexagon",
};

let currentShape = "circle";
let currentSlide = 0;
let swapState = {}; // slideIndex -> true 表示已互换

// ============================================================
// 生成形状的 SVG path
// ============================================================
function getShapeSVG(shape, size, fill) {
  const cx = size/2, cy = size/2;
  switch(shape) {
    case "circle":
      return `<circle cx="${cx}" cy="${cy}" r="${size*0.38}" fill="${fill}"/>`;
    case "square":
      return `<rect x="${size*0.18}" y="${size*0.18}" width="${size*0.64}" height="${size*0.64}" rx="${size*0.06}" fill="${fill}"/>`;
    case "triangle": {
      const r = size*0.4;
      const pts = [
        [cx, cy - r],
        [cx + r*0.866, cy + r*0.5],
        [cx - r*0.866, cy + r*0.5],
      ].map(p=>p.join(",")).join(" ");
      return `<polygon points="${pts}" fill="${fill}"/>`;
    }
    case "star": {
      const r1 = size*0.42, r2 = size*0.18;
      let pts = "";
      for(let i=0;i<10;i++){
        const angle = -Math.PI/2 + i*Math.PI/5;
        const r = i%2===0 ? r1 : r2;
        pts += `${cx+Math.cos(angle)*r},${cy+Math.sin(angle)*r} `;
      }
      return `<polygon points="${pts.trim()}" fill="${fill}"/>`;
    }
    case "diamond": {
      const r = size*0.4;
      const pts = `${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}`;
      return `<polygon points="${pts}" fill="${fill}"/>`;
    }
    case "hexagon": {
      let pts = "";
      for(let i=0;i<6;i++){
        const angle = -Math.PI/2 + i*Math.PI/3;
        const r = size*0.38;
        pts += `${cx+Math.cos(angle)*r},${cy+Math.sin(angle)*r} `;
      }
      return `<polygon points="${pts.trim()}" fill="${fill}"/>`;
    }
  }
  return "";
}

// ============================================================
// 构建幻灯片
// ============================================================
function buildSlides() {
  const root = document.getElementById("slides");
  const dotsRoot = document.getElementById("dots");
  root.innerHTML = "";
  dotsRoot.innerHTML = "";

  const total = COLOR_PAIRS.length + 3; // cover + wheel + experiment + N color pages

  // --- Slide 0: Cover ---
  const cover = document.createElement("div");
  cover.className = "slide active";
  cover.innerHTML = `
    <div class="cover-title">互补色色卡</div>
    <div class="cover-subtitle">COMPLEMENTARY COLORS</div>
    <div class="settings-panel">
      <label>形状：</label>
      <button class="shape-btn active" data-shape="circle">● 圆形</button>
      <button class="shape-btn" data-shape="triangle">▲ 三角</button>
      <button class="shape-btn" data-shape="star">★ 五星</button>
      <button class="shape-btn" data-shape="square">■ 方</button>
      <button class="shape-btn" data-shape="diamond">◆ 菱</button>
      <button class="shape-btn" data-shape="hexagon">⬣ 六边</button>
    </div>
  `;
  root.appendChild(cover);

  // shape buttons
  cover.querySelectorAll(".shape-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      cover.querySelectorAll(".shape-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentShape = btn.dataset.shape;
      // rebuild color card slides
      rebuildColorSlides();
    });
  });

  // --- Slide 1: Color Wheel ---
  const wheelSlide = document.createElement("div");
  wheelSlide.className = "slide";
  wheelSlide.innerHTML = `
    <div class="page-title">12 色环 · 互补色对</div>
    <svg class="wheel-svg" viewBox="0 0 400 400" id="colorWheel"></svg>
  `;
  root.appendChild(wheelSlide);

  // --- Slide 2..N+1: Color pair cards ---
  COLOR_PAIRS.forEach((pair, i) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.dataset.idx = i;
    slide.innerHTML = `
      <div class="page-title">${pair.bgName} · ${pair.fgName}</div>
      <div class="card-container" data-i="${i}">
        <svg class="card-svg" viewBox="0 0 400 400" id="cardSvg_${i}"></svg>
      </div>
      <div class="hex-labels">
        <div class="hex-item">
          <div class="hex-swatch" style="background:${pair.bgHex}"></div>
          <div class="hex-text">${pair.bgHex}</div>
        </div>
        <div class="hex-item">
          <div class="hex-swatch" style="background:${pair.fgHex}"></div>
          <div class="hex-text">${pair.fgHex}</div>
        </div>
      </div>
      <div class="swap-hint">点击卡片互换前景/背景</div>
    `;
    root.appendChild(slide);

    // click to swap
    slide.querySelector(".card-container").addEventListener("click", ()=>{
      swapState[i] = !swapState[i];
      drawCard(i);
    });
  });

  // --- Last Slide: Afterimage Experiment ---
  const expSlide = document.createElement("div");
  expSlide.className = "slide";
  expSlide.innerHTML = `
    <div class="page-title">负后像实验</div>
    <div class="exp-title">点击任意一组 → 白屏观察互补色残像</div>
    <div class="exp-pairs" id="expPairs"></div>
  `;
  root.appendChild(expSlide);

  // build experiment pairs
  const expRoot = expSlide.querySelector("#expPairs");
  COLOR_PAIRS.forEach((pair, i) => {
    const row = document.createElement("div");
    row.className = "exp-pair";
    row.innerHTML = `
      <div class="exp-shape-row">
        <svg width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" fill="${pair.bgHex}" rx="6"/><polygon points="24,12 28,22 38,23 30,30 32,40 24,34 16,40 18,30 10,23 20,22" fill="${pair.fgHex}" transform="scale(1.6) translate(-9,-9)"/></svg>
        <span class="exp-arrow">↓ 盯 30 秒 ↓</span>
        <svg width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" fill="#FFFFFF" rx="6"/><polygon points="24,12 28,22 38,23 30,30 32,40 24,34 16,40 18,30 10,23 20,22" fill="${pair.bgHex}" transform="scale(1.6) translate(-9,-9)"/></svg>
      </div>
      <div class="exp-label">${pair.bgName} → 残像 ${pair.fgName}</div>
    `;
    row.addEventListener("click", ()=>{
      triggerAfterimage(pair);
    });
    expRoot.appendChild(row);
  });

  // dots
  const slideCount = root.children.length;
  for(let i=0;i<slideCount;i++){
    const d = document.createElement("button");
    d.className = "dot" + (i===0?" active":"");
    d.addEventListener("click", ()=>goTo(i));
    dotsRoot.appendChild(d);
  }

  // initial draw
  drawColorWheel();
  COLOR_PAIRS.forEach((_,i)=>drawCard(i));
}

// ============================================================
// 重建颜色卡片（形状改变时）
// ============================================================
function rebuildColorSlides() {
  COLOR_PAIRS.forEach((_,i)=>drawCard(i));
}

// ============================================================
// 绘制单张卡片
// ============================================================
function drawCard(i) {
  const pair = COLOR_PAIRS[i];
  const svg = document.getElementById("cardSvg_"+i);
  if(!svg) return;
  const swapped = swapState[i];
  const bg = swapped ? pair.fgHex : pair.bgHex;
  const fg = swapped ? pair.bgHex : pair.fgHex;
  const size = 400;
  svg.innerHTML = `
    <rect width="${size}" height="${size}" fill="${bg}" rx="${size*0.04}"/>
    ${getShapeSVG(currentShape, size, fg)}
  `;
}

// ============================================================
// 绘制色环
// ============================================================
function drawColorWheel() {
  const svg = document.getElementById("colorWheel");
  if(!svg) return;
  const cx=200, cy=200, r=150, innerR=80;
  const wheelColors = [
    "#FF3B30","#FF6B1A","#FF9F0A","#FFCC00","#B6E800","#34C759",
    "#00C7BE","#007AFF","#5856D6","#AF52DE","#FF2D92","#FF3B30"
  ];
  let html = "";
  for(let i=0;i<12;i++){
    const a1 = -Math.PI/2 + i*Math.PI/6;
    const a2 = a1 + Math.PI/6;
    const x1=cx+Math.cos(a1)*innerR, y1=cy+Math.sin(a1)*innerR;
    const x2=cx+Math.cos(a1)*r,     y2=cy+Math.sin(a1)*r;
    const x3=cx+Math.cos(a2)*r,     y3=cy+Math.sin(a2)*r;
    const x4=cx+Math.cos(a2)*innerR,y4=cy+Math.sin(a2)*innerR;
    html += `<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}" fill="${wheelColors[i]}" stroke="#0a0a0a" stroke-width="1"/>`;
  }
  // complementary lines
  for(let i=0;i<6;i++){
    const a = -Math.PI/2 + i*Math.PI/6 + Math.PI/12;
    const x1=cx+Math.cos(a)*(innerR-6), y1=cy+Math.sin(a)*(innerR-6);
    const x2=cx+Math.cos(a+Math.PI)*(innerR-6), y2=cy+Math.sin(a+Math.PI)*(innerR-6);
    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
  }
  svg.innerHTML = html;
}

// ============================================================
// 负后像触发
// ============================================================
function triggerAfterimage(pair) {
  const overlay = document.getElementById("aiOverlay");
  overlay.style.background = "#FFFFFF";
  overlay.innerHTML = `
    <svg width="80%" height="80%" viewBox="0 0 400 400" id="aiSvg"></svg>
    <span class="hint">紧盯中心 20~30 秒 → 然后不要眨眼 → 残像即将出现</span>
  `;
  const aiSvg = document.getElementById("aiSvg");
  // Show the complement color shape on white
  const size = 400;
  const stimColor = pair.fgHex; // 刺激色 = 前景色
  aiSvg.innerHTML = `
    <rect width="${size}" height="${size}" fill="#FFFFFF"/>
    ${getShapeSVG(currentShape, size, stimColor)}
  `;
  overlay.classList.add("active");

  // After 8 seconds, turn all white -> afterimage appears
  setTimeout(()=>{
    overlay.innerHTML = `<span class="hint">👁 现在你看到的是 ${pair.bgName} 的残像（${pair.bgHex}）</span>`;
    overlay.style.background = "#FFFFFF";
  }, 8000);
}

// ============================================================
// 幻灯片导航
// ============================================================
function goTo(i) {
  const slides = document.querySelectorAll(".slide");
  const dots = document.querySelectorAll(".dot");
  const total = slides.length;
  currentSlide = (i + total) % total;
  slides.forEach((s,idx)=>s.classList.toggle("active", idx===currentSlide));
  dots.forEach((d,idx)=>d.classList.toggle("active", idx===currentSlide));
  document.getElementById("pageNum").textContent = `${currentSlide+1} / ${total}`;
}

document.getElementById("prevBtn").addEventListener("click", ()=>goTo(currentSlide-1));
document.getElementById("nextBtn").addEventListener("click", ()=>goTo(currentSlide+1));

// ============================================================
// 全屏
// ============================================================
const fsBtn = document.getElementById("fsBtn");
fsBtn.addEventListener("click", toggleFullscreen);
document.addEventListener("keydown", e=>{
  if(e.key==="f"||e.key==="F") toggleFullscreen();
  if(e.key==="ArrowRight") goTo(currentSlide+1);
  if(e.key==="ArrowLeft") goTo(currentSlide-1);
  if(e.key==="Escape") {
    document.getElementById("aiOverlay").classList.remove("active");
  }
});

function toggleFullscreen() {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

// ============================================================
// 触摸滑动
// ============================================================
let touchStartX = 0, touchStartY = 0;
document.addEventListener("touchstart", e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
    if(dx<0) goTo(currentSlide+1); else goTo(currentSlide-1);
  }
},{passive:true});

// ============================================================
// 鼠标滚轮
// ============================================================
let wheelLock = false;
document.addEventListener("wheel", e=>{
  if(wheelLock) return;
  wheelLock = true;
  if(e.deltaY>30) goTo(currentSlide+1);
  else if(e.deltaY<-30) goTo(currentSlide-1);
  setTimeout(()=>wheelLock=false, 600);
},{passive:true});

// ============================================================
// 关闭残像遮罩
// ============================================================
document.getElementById("aiOverlay").addEventListener("click", function(){
  this.classList.remove("active");
});

// ============================================================
// INIT
// ============================================================
buildSlides();
goTo(0);
</script>
</body>
</html>
